name: ksu-9i

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-11 g++-11 flex bison \
            libssl-dev libelf-dev bc python3 git clang lld llvm \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf \
            device-tree-compiler libncurses-dev

      - name: Stock defconfig
        run: |
          mkdir -p out
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            HOSTCC=gcc-11 vendor/bengal-perf_defconfig 2>&1 | tee stock-defconfig.log

      - name: Integrate ReSukiSU
        if: success()
        run: |
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

      - name: KSU defconfig
        if: success()
        run: |
          echo "CONFIG_KSU=y" >> out/.config
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> out/.config
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            HOSTCC=gcc-11 olddefconfig 2>&1 | tee ksu-defconfig.log

      - name: Build
        if: success()
        run: |
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            HOSTCC=gcc-11 CC=clang LD=ld.lld -j$(nproc)

      - name: Upload logs and Image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-out
          path: |
            stock-defconfig.log
            ksu-defconfig.log
            out/.config
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
          if-no-files-found: warn
