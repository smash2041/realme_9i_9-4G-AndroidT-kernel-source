name: ksu-9i

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison libssl-dev libelf-dev bc \
            python3 git clang lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf \
            device-tree-compiler libncurses-dev

      - name: Integrate ReSukiSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

      - name: Defconfig
        run: |
          mkdir -p out
          ls -l arch/arm64/configs/vendor/bengal-perf_defconfig
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- HOSTCC=gcc vendor/bengal-perf_defconfig
          echo "CONFIG_KSU=y" >> out/.config
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> out/.config
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- HOSTCC=gcc olddefconfig

      - name: Build
        run: |
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang LD=ld.lld HOSTCC=gcc -j$(nproc)

      - name: Upload Image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-out
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
          if-no-files-found: warn
