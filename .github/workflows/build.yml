name: ksu-9i

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STUB_PY: |
        import os, re
        from pathlib import Path

        def stub_broken_symlinks():
            n = 0
            for dirpath, dirnames, filenames in os.walk("."):
                if "/.git" in dirpath.replace("\\", "/") or dirpath.startswith("./.git"):
                    continue
                for name in list(dirnames) + list(filenames):
                    p = Path(dirpath) / name
                    try:
                        if not p.is_symlink():
                            continue
                        if p.exists():
                            continue
                    except OSError:
                        pass
                    try:
                        target = os.readlink(p)
                    except OSError:
                        continue
                    try:
                        p.unlink()
                    except Exception:
                        pass
                    is_file = p.suffix in {".c", ".h", ".S", ".s", ".dts", ".dtsi"} or str(target).endswith((".c", ".h", ".S", ".s"))
                    try:
                        if is_file:
                            p.parent.mkdir(parents=True, exist_ok=True)
                            if p.suffix == ".h":
                                g = p.name.upper().replace(".", "_").replace("-", "_")
                                p.write_text("#ifndef %s\n#define %s\n#endif\n" % (g, g))
                            else:
                                p.write_text("/* stub */\n")
                        else:
                            p.mkdir(parents=True, exist_ok=True)
                            (p / "Kconfig").write_text("# stub\n")
                            (p / "Makefile").write_text("# stub\n")
                        n += 1
                        print("symlink-stub", p)
                    except Exception as e:
                        print("error stubbing", p, e)
            return n

        def stub_missing_kconfig_sources():
            total = 0
            for _ in range(8):
                added = 0
                for p in Path(".").rglob("Kconfig*"):
                    if ".git" in str(p):
                        continue
                    try:
                        t = p.read_text(errors="replace")
                    except Exception:
                        continue
                    for m in re.finditer(r'source\s+"([^"]+)"', t):
                        rel = m.group(1)
                        if "$" in rel:
                            continue
                        q = Path(rel)
                        if not q.exists():
                            try:
                                q.parent.mkdir(parents=True, exist_ok=True)
                                q.write_text("# stub\n")
                                added += 1
                                print("kconfig-stub", q)
                            except Exception:
                                pass
                total += added
                if added == 0:
                    break
            return total

        def write_hdr(q):
            try:
                q.parent.mkdir(parents=True, exist_ok=True)
                g = re.sub(r"[^A-Z0-9]", "_", q.name.upper())
                q.write_text("#ifndef _STUB_%s\n#define _STUB_%s\n#endif\n" % (g, g))
                print("hdr-stub", q)
            except Exception as e:
                print("Failed to write hdr stub", q)

        def stub_missing_headers():
            inc_re = re.compile(r'^\s*#\s*include\s*[<"]([^>"]+)[>"]', re.M)
            keys = ("sched_assist", "healthinfo", "iomonitor", "oplus", "oppo", "special_opt", "seccomp_types", "lowmem_dbg", "kevent", "nandswap")
            n = 0
            seen = set()
            for p in Path(".").rglob("*"):
                if p.suffix not in {".c", ".h", ".S"}:
                    continue
                if ".git" in str(p):
                    continue
                try:
                    t = p.read_text(errors="replace")
                except Exception:
                    continue
                for m in inc_re.finditer(t):
                    rel = m.group(1)
                    if "$" in rel or rel.startswith("asm/"):
                        continue
                    local = p.parent / rel
                    inc = Path("include") / rel
                    if local.exists() or inc.exists() or Path(rel).exists():
                        continue
                    if not any(k in rel or k in str(p) for k in keys):
                        if not (rel.startswith("linux/") and "seccomp" in rel):
                            continue
                    q = inc if (rel.startswith(("linux/", "soc/", "net/", "uapi/")) or rel.endswith(".h") and "/" in rel) else local
                    if not any(k in str(q) or k in rel for k in keys) and "seccomp" not in rel:
                        q = inc
                    key = str(q)
                    if key in seen:
                        continue
                    seen.add(key)
                    write_hdr(q)
                    n += 1
            for extra in [
                "include/linux/seccomp_types.h",
                "include/linux/sched_assist/sched_assist_mutex.h",
                "include/linux/sched_assist/sched_assist_common.h",
                "include/linux/sched_assist/sched_assist_fork.h",
                "include/linux/sched_assist/sched_assist_rwsem.h",
                "include/linux/sched_assist/sched_assist_slide.h",
                "include/linux/sched_assist/sched_assist_binder.h",
            ]:
                q = Path(extra)
                if not q.exists():
                    write_hdr(q)
                    n += 1
            return n

        print("Running stub scripts safely...")
        try:
            ns = stub_broken_symlinks()
            nk = stub_missing_kconfig_sources()
            nh = stub_missing_headers()
            print("symlink_total", ns)
            print("kconfig_total", nk)
            print("header_total", nh)
        except Exception as e:
            print("Fatal error in stubbing:", e)

      HOOK_PY: |
        from pathlib import Path
        import sys

        def inject(path, marker, needle, payload):
            p = Path(path)
            if not p.exists():
                print("skip (not found)", path)
                return True
            try:
                t = p.read_text(errors="replace")
            except Exception:
                print("skip (read error)", path)
                return True
            if marker in t:
                print("skip (already patched)", path, marker)
                return True
            i = t.find(needle)
            if i < 0:
                print("FAIL needle", path, needle[:70])
                return False
            b = t.find("{", i)
            if b < 0:
                print("FAIL brace", path)
                return False
            t = t[: b + 1] + payload + t[b + 1 :]
            p.write_text(t)
            print("ok", path, marker)
            return True

        ok = True
        ok &= inject(
            "fs/exec.c",
            "ksu_handle_execveat",
            "static int do_execveat_common(",
            "\n#ifdef CONFIG_KSU_MANUAL_HOOK\n"
            "\t{ extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n"
            "\t  ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags); }\n"
            "#endif\n",
        )
        ok &= inject(
            "fs/open.c",
            "ksu_handle_faccessat",
            "SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)",
            "\n#ifdef CONFIG_KSU_MANUAL_HOOK\n"
            "\t{ extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n"
            "\t  ksu_handle_faccessat(&dfd, &filename, &mode, 0); }\n"
            "#endif\n",
        )
        ok &= inject(
            "fs/read_write.c",
            "ksu_handle_sys_read",
            "ssize_t vfs_read(struct file *file, char __user *buf, size_t count, loff_t *pos)",
            "\n#ifdef CONFIG_KSU_MANUAL_HOOK\n"
            "\t{ extern int ksu_handle_sys_read(char __user **buf_ptr, size_t *count_ptr);\n"
            "\t  ksu_handle_sys_read(&buf, &count); }\n"
            "#endif\n",
        )
        ok &= inject(
            "fs/stat.c",
            "ksu_handle_stat",
            "SYSCALL_DEFINE4(newfstatat, int, dfd, const char __user *, filename,",
            "\n#ifdef CONFIG_KSU_MANUAL_HOOK\n"
            "\t{ extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\n"
            "\t  extern void ksu_handle_newfstat_ret(unsigned int *fd, struct stat __user **statbuf_ptr);\n"
            "\t  extern void ksu_handle_fstat64_ret(unsigned long *fd, void *statbuf_ptr);\n"
            "\t  ksu_handle_stat(&dfd, &filename, &flag); }\n"
            "#endif\n",
        )
        ok &= inject(
            "kernel/sys.c",
            "ksu_handle_setresuid",
            "SYSCALL_DEFINE3(setresuid, uid_t, ruid, uid_t, euid, uid_t, suid)",
            "\n#ifdef CONFIG_KSU_MANUAL_HOOK\n"
            "\t{ extern int ksu_handle_setresuid(uid_t ruid, uid_t euid, uid_t suid);\n"
            "\t  ksu_handle_setresuid(ruid, euid, suid); }\n"
            "#endif\n",
        )
        ok &= inject(
            "drivers/input/input.c",
            "ksu_handle_input_handle_event",
            "static void input_handle_event(struct input_dev *dev,",
            "\n#ifdef CONFIG_KSU_MANUAL_HOOK\n"
            "\t{ extern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);\n"
            "\t  ksu_handle_input_handle_event(&type, &code, &value); }\n"
            "#endif\n",
        )
        ok &= inject(
            "kernel/reboot.c",
            "ksu_handle_sys_reboot",
            "SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,",
            "\n#ifdef CONFIG_KSU_MANUAL_HOOK\n"
            "\t{ extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n"
            "\t  ksu_handle_sys_reboot(magic1, magic2, cmd, &arg); }\n"
            "#endif\n",
        )
        if not ok:
            sys.exit("hook inject failed")
        print("hooks-ok")

    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-11 g++-11 flex bison libssl-dev libelf-dev bc python3 git gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf device-tree-compiler libncurses-dev

      - name: Fix wrapper and stub OEM holes
        run: |
          printf '%s\n' '#!/usr/bin/env python3' 'import os,sys' 'os.execvp(sys.argv[1], sys.argv[1:])' > scripts/gcc-wrapper.py
          chmod +x scripts/gcc-wrapper.py
          python3 -c "import os; exec(os.environ['STUB_PY'])"

      - name: Integrate ReSukiSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
          python3 -c "import os; exec(os.environ['STUB_PY'])" || true

      - name: Apply manual syscall hooks
        run: |
          python3 -c "import os; exec(os.environ['HOOK_PY'])"

      - name: Defconfig
        run: |
          set -o pipefail
          mkdir -p out
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- HOSTCC=gcc-11 vendor/bengal-perf_defconfig 2>&1 | tee defconfig.log
          echo CONFIG_KSU=y >> out/.config
          echo CONFIG_KSU_MANUAL_HOOK=y >> out/.config
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- HOSTCC=gcc-11 olddefconfig 2>&1 | tee -a defconfig.log

      - name: Build
        run: |
          set -o pipefail
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- HOSTCC=gcc-11 -j$(nproc) 2>&1 | tee build.log

      - name: Upload logs and Image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-out
          path: |
            defconfig.log
            build.log
            out/.config
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
          if-no-files-found: warn
